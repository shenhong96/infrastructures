# Safety settings on every stack, enforced by tests/test_komodo_gate.py: a sync only creates
# or updates the stack record. Nothing deploys until someone runs DeployStack on it.

[[stack]]
name = "monitoring-gitlab"
[stack.config]
server = "gitlab"
auto_pull = false
poll_for_updates = false
auto_update = false
webhook_enabled = false
project_name = "monitoring"
repo = "shenhong96/infrastructures"
branch = "main"
git_provider = "github.com"
run_directory = "stacks/monitoring-gitlab"
file_paths = ["compose.yaml"]
# The promtail config is bind-mounted from this folder and read at start: a change restarts the service.
config_files = [{ path = "promtail-config.yaml", services = ["promtail"], requires = "Restart" }]
