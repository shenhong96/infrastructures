# The reverse proxy on CT 104 (Proxmox). Komodo runs this file and owns the Dockerfile next to it;
# Ansible keeps what Caddy reads under /opt/caddy: .env and conf/ (Caddyfile, private.caddy).
# The image exists, so a deploy never builds; a rebuild is a deliberate `docker compose build`.
name: proxy

services:
  caddy:
    image: caddy-cf:2.8.4
    build:
      context: .
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # CF_API_TOKEN and ACME_EMAIL, which the Caddyfile refers to as {env.NAME}. Read only when
    # the container is created, so a changed token needs `up -d`, not a reload.
    env_file: /opt/caddy/.env
    volumes:
      # A folder, not the file: Ansible replaces the Caddyfile with a new inode, which a
      # single-file bind mount would never see.
      - /opt/caddy/conf:/etc/caddy
      - /opt/caddy/data:/data
      - /opt/caddy/config:/config
