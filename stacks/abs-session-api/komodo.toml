# Safety settings on every stack, enforced by tests/test_komodo_gate.py: a sync only creates
# or updates the stack record. Nothing deploys until someone runs DeployStack on it.

[[stack]]
name = "abs-session-api"
[stack.config]
server = "apps"
auto_pull = false
poll_for_updates = false
auto_update = false
webhook_enabled = false
project_name = "abs-session-api"
repo = "shenhong96/infrastructures"
branch = "main"
git_provider = "github.com"
run_directory = "stacks/abs-session-api"
file_paths = ["compose.yaml"]
# Secrets: decrypted into secrets.env next to the compose file just before every deploy (the helper
# roles/periphery installs; a failed decrypt stops the deploy). The encrypted files are tracked,
# so a secret-only change counts as a changed stack; the plaintext is never tracked or stored.
pre_deploy.command = "/usr/local/sbin/komodo-decrypt-env secrets.sops.env"
# The app code is bind-mounted from this folder and read at start: a change restarts the service.
config_files = [
  { path = "secrets.sops.env", requires = "Redeploy" },
  { path = "server.js", services = ["abs-session-api"], requires = "Restart" },
  { path = "index.html", services = ["abs-session-api"], requires = "Restart" },
  { path = "widget.html", services = ["abs-session-api"], requires = "Restart" },
]
# `docker compose config` output is stored in Core: keep the secret values out of it.
compose_cmd_wrapper = "set -o pipefail; [[COMPOSE_COMMAND]] | /usr/local/sbin/komodo-redact-config secrets.env"
compose_cmd_wrapper_include = ["config"]
