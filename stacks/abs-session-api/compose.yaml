# Captured 2026-10-01 from CT 111 /opt/aio/abs-session-api/docker-compose.yml (project abs-session-api).
# The app code now lives next to this file in git; the API token comes from secrets.sops.env (ABS_TOKEN).
services:
  abs-session-api:
    image: node:26-alpine
    container_name: abs-session-api
    command: node /app/server.js
    working_dir: /app
    restart: unless-stopped
    ports:
      - 7778:7778
    env_file: secrets.env
    environment:
      - ABS_BASE_URL=http://192.168.9.151:13378
      - PORT=7778
      - SESSIONS_LIMIT=20
      - CACHE_TTL_SECONDS=30
      - ITEM_CACHE_TTL_SECONDS=3600
    volumes:
      - ./server.js:/app/server.js:ro
      - ./index.html:/app/index.html:ro
      - ./widget.html:/app/widget.html:ro
    labels:
      gethomepage.enable: "true"
      gethomepage.name: "Audiobook Sessions"
      gethomepage.group: "Media"
      gethomepage.href: "http://192.168.9.151:7778/"
      gethomepage.widget.type: "iframe"
      gethomepage.widget.src: "http://192.168.9.151:7778/widget"
      gethomepage.widget.classes: "h-20 sm:h-20 md:h-20 lg:h-20 xl:h-20 2xl:h-20"
      gethomepage.widget.allowScrolling: "yes"
      gethomepage.widget.refreshInterval: "30000"
