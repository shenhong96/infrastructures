# nextcloud: CT 112 (Nextcloud-C-Rieger), Ubuntu LXC. Its labels on every series and log line.
services:
  alloy:
    environment:
      HOST: nextcloud
      HOST_KIND: lxc
      VMID: "112"
    # A privileged LXC: docker-default AppArmor would block docker.sock for Alloy.
    security_opt:
      - apparmor=unconfined
