# Proves the secrets path end to end on one machine: Komodo's pre-deploy step decrypts
# secrets.sops.env into secrets.env, compose passes CANARY_SECRET into the container, and the
# value must appear nowhere in Komodo's update logs or stored config (see the runbook).
services:
  canary-secret:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: sleep infinity
    restart: unless-stopped
    environment:
      - CANARY_SECRET=${CANARY_SECRET}
