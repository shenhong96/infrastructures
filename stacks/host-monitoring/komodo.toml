# Safety settings on every stack, enforced by tests/test_komodo_gate.py: a sync only creates
# or updates the stack record. Nothing deploys until someone runs DeployStack on it.

[[stack]]
name = "host-monitoring"
[stack.config]
server = "proxmox"
auto_pull = false
poll_for_updates = false
auto_update = false
webhook_enabled = false
project_name = "opt"
repo = "shenhong96/infrastructures"
branch = "main"
git_provider = "github.com"
run_directory = "stacks/host-monitoring"
file_paths = ["compose.yaml"]
# Static config bind-mounted from this folder and read at start: a change restarts only that service.
config_files = [
  { path = "prometheus.yml", services = ["prometheus"], requires = "Restart" },
  { path = "loki-config.yaml", services = ["loki"], requires = "Restart" },
  { path = "grafana-datasources/datasources.yaml", services = ["grafana"], requires = "Restart" },
  { path = "grafana-dashboards-provider/homelab.yaml", services = ["grafana"], requires = "Restart" },
  { path = "grafana-dashboards/homelab-hosts.json", services = ["grafana"], requires = "Restart" },
]
