# Per-guest CPU and memory from lxc_* (lxc-cpu/metrics.sh), keyed by host and vmid like the guests' own metrics.
groups:
  - name: lxc-cpu
    rules:
      # Cores in use.
      - record: lxc:cpu_usage_cores:rate5m
        expr: rate(lxc_cpu_usage_seconds_total[5m])
      # Share of the guest's cores in use, 0 to 1.
      - record: lxc:cpu_usage_ratio:rate5m
        expr: lxc:cpu_usage_cores:rate5m / on (host, vmid) lxc_cpu_cores
      # Share of time some of its tasks waited for a CPU, 0 to 1: the load substitute, since a
      # guest's loadavg is the host's.
      - record: lxc:cpu_pressure_ratio:rate5m
        expr: rate(lxc_pressure_cpu_waiting_seconds_total[5m])

  - name: lxc-memory
    rules:
      # Share of the guest's cap held by memory the kernel can't drop, 0 to 1. Page cache is left
      # out: it fills any cap and is given back on demand.
      - record: lxc:memory_anon_ratio
        expr: lxc_memory_anon_bytes / on (host, vmid) lxc_memory_limit_bytes
      # Share of time some of its tasks waited for memory or IO, 0 to 1.
      - record: lxc:memory_pressure_ratio:rate5m
        expr: rate(lxc_pressure_memory_waiting_seconds_total[5m])
      - record: lxc:io_pressure_ratio:rate5m
        expr: rate(lxc_pressure_io_waiting_seconds_total[5m])

      # No Alertmanager yet: these show at Prometheus /alerts and as ALERTS series, nowhere else.
      - alert: LxcOomKill
        expr: increase(lxc_memory_oom_kills_total[10m]) > 0
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.host }}: the kernel killed a process at the guest's memory cap"}
      - alert: LxcMemoryThrashing
        expr: lxc:memory_pressure_ratio:rate5m > 0.5
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.host }}: tasks wait on memory over half the time"}
      - alert: LxcMemoryNearCap
        expr: lxc:memory_anon_ratio > 0.9
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.host }}: unreclaimable memory over 90% of the cap"}
