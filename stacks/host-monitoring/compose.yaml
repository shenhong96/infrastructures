# Captured 2026-10-01 from proxmox host /opt/docker-compose.yml (project opt).
# Relative paths made absolute, Portainer's agent removed. The Prometheus, Loki and Grafana datasource config
# now live next to this file (bind-mounted read-only); the data folders stay on the machine.
---
x-monitoring: &loki
  labels:
    logging: "promtail"
    logging_jobname: "containerlogs"

version: '3.5'
networks:
  monitoring:
    name: main-monitoring-stack
services:
  scrutiny:
    container_name: scrutiny
    privileged: true
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    ports:
      - "8080:8080" # webapp
      - "8086:8086" # influxDB admin
    environment:
      - SCRUTINY_COLLECTOR=true
      - COLLECTOR_CRON_SCHEDULE="0 0 * * *"
      - DEBUG=true
      - COLLECTOR_LOG_FILE=/tmp/collector.log
    volumes:
      - /run/udev:/run/udev:ro
      - /opt/scrutiny/config:/opt/scrutiny/config
      - /opt/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      - "/dev/sda"
      - "/dev/sdb"
      - "/dev/sdc"
      - "/dev/sdd"
      - "/dev/sde"
      - "/dev/sdf"
      - "/dev/sdg"
      - "/dev/nvme0"
      - "/dev/nvme1"
      - "/dev/nvme2"
    restart: always
    <<: *loki

  dash:
    image: mauricenino/dashdot:latest
    restart: unless-stopped
    privileged: true
    ports:
      - '3001:3001'
    volumes:
      - /:/mnt/host:ro
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: 'true'

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/storage/appdata/monitoring/prometheus:/prometheus
    command: 
      - '--web.enable-lifecycle'  
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms' 
      - '--enable-feature=remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml' 
    networks:
      - monitoring
    <<: *loki

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - 9100:9100
    restart: unless-stopped
    networks:
      - monitoring
    <<: *loki

  grafana:
    # 13 moves folders and dashboards into its own storage on first start; there's no way back to 12.
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: grafana
    user: root
    # Grafana 13 runs its datasources (Prometheus, Loki, ...) as plugin processes that talk to it over
    # unix sockets, and Docker's docker-default AppArmor profile refuses to create those on this host
    # (AppArmor 4, Proxmox 9): every datasource then reads "not found". The other confinement stays.
    security_opt:
      - apparmor=unconfined
    ports:
      - 3000:3000
    restart: unless-stopped
    volumes:
      - ./grafana-datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-dashboards-provider:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-dashboards:/etc/grafana/dashboards/homelab:ro
      - /mnt/storage/appdata/monitoring/grafana:/var/lib/grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    user: root
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /mnt/storage/appdata/monitoring/loki:/tmp/loki # This is where loki stores all the data chunks, the logs.
    ports:
      - "3100:3100"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml

