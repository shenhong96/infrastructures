---
# NOTE: putting search first here does NOT choose its row — gethomepage
# hard-routes search+datetime into #information-widgets-right, after
# greeting/resources; the leading row is enforced in custom.css.
# Keep search ABOVE datetime: within that container, file order = left/right.
- search:
    provider: google
    target: _blank

- greeting:
    text_size: 2xl
    text: "Welcome back 👾"

- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23

- resources:
    cpu: true
    memory: true
    disk: /
    expanded: true
    label: root

- resources:
    disk: /mnt/appdata
    expanded: true
    label: storage (54TB)

- resources:
    disk: /mnt/ssd
    expanded: true
    label: zfs-ssd
