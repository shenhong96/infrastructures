# Safety settings on every stack, enforced by tests/test_komodo_gate.py: a sync only creates
# or updates the stack record. Nothing deploys until someone runs DeployStack on it.

[[stack]]
name = "aio"
[stack.config]
server = "apps"
auto_pull = false
poll_for_updates = false
auto_update = false
webhook_enabled = false
project_name = "aio"
repo = "shenhong96/infrastructures"
branch = "main"
git_provider = "github.com"
run_directory = "stacks/aio"
file_paths = ["compose.yaml"]
# Secrets: decrypted into secrets.env next to the compose file just before every deploy (the helper
# roles/periphery installs; a failed decrypt stops the deploy). The encrypted files are tracked,
# so a secret-only change counts as a changed stack; the plaintext is never tracked or stored.
# The *.sops.yaml blobs (homepage, smokeping Targets and ssmtp.conf) are whole config files kept opaque in the public
# repo: komodo-decrypt-files puts them in .decrypted/ (root-only folder) and writes files.env with a hash per folder,
# which the compose file uses as a label so a changed blob recreates just that container.
pre_deploy.command = '''
/usr/local/sbin/komodo-decrypt-env secrets.sops.env
/usr/local/sbin/komodo-decrypt-files -m 0644 \
  homepage/bookmarks.sops.yaml homepage/docker.sops.yaml homepage/proxmox.sops.yaml \
  homepage/services.sops.yaml homepage/settings.sops.yaml homepage/widgets.sops.yaml \
  smokeping/Targets.sops.yaml smokeping/ssmtp.conf.sops.yaml
'''
# Plain files read at start: a change restarts that service. Blobs: a redeploy of that service (decrypt, then the label recreates it).
config_files = [
  { path = "secrets.sops.env", requires = "Redeploy" },
  { path = "homepage/bookmarks.sops.yaml", services = ["homepage"], requires = "Redeploy" },
  { path = "homepage/docker.sops.yaml", services = ["homepage"], requires = "Redeploy" },
  { path = "homepage/proxmox.sops.yaml", services = ["homepage"], requires = "Redeploy" },
  { path = "homepage/services.sops.yaml", services = ["homepage"], requires = "Redeploy" },
  { path = "homepage/settings.sops.yaml", services = ["homepage"], requires = "Redeploy" },
  { path = "homepage/widgets.sops.yaml", services = ["homepage"], requires = "Redeploy" },
  { path = "homepage/custom.css", services = ["homepage"], requires = "Restart" },
  { path = "homepage/custom.js", services = ["homepage"], requires = "Restart" },
  { path = "homepage/kubernetes.yaml", services = ["homepage"], requires = "Restart" },
  { path = "smokeping/Targets.sops.yaml", services = ["smokeping"], requires = "Redeploy" },
  { path = "smokeping/ssmtp.conf.sops.yaml", services = ["smokeping"], requires = "Redeploy" },
  { path = "smokeping/General", services = ["smokeping"], requires = "Restart" },
  { path = "smokeping/Alerts", services = ["smokeping"], requires = "Restart" },
  { path = "smokeping/Probes", services = ["smokeping"], requires = "Restart" },
  { path = "smokeping/Presentation", services = ["smokeping"], requires = "Restart" },
  { path = "olivetin/config.yaml", services = ["olivetin"], requires = "Restart" },
  { path = "speedtest-grafana/provisioning/dashboards/dashboard.yml", services = ["grafana"], requires = "Restart" },
  { path = "speedtest-grafana/provisioning/dashboards/speedtest.json", services = ["grafana"], requires = "Restart" },
  { path = "speedtest-grafana/provisioning/datasources/influxdb.yml", services = ["grafana"], requires = "Restart" },
]
additional_env_files = [
  { path = "secrets.env", track = false },
  { path = "files.env", track = false },
]
# `docker compose config` output is stored in Core: keep the secret values out of it.
compose_cmd_wrapper = "set -o pipefail; [[COMPOSE_COMMAND]] | /usr/local/sbin/komodo-redact-config secrets.env"
compose_cmd_wrapper_include = ["config"]
