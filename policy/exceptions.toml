# What the gate's compose and Komodo rules would block, allowed as it is today (2026-10-03).
# policy/ is a gate file: a new entry passes only with your gate-change label.

# Stacks Komodo may run on the hypervisor.
proxmox_stacks = ["canary-proxmox", "host-monitoring"]
# Stacks whose compose file stays on the machine, out of git.
files_on_host_stacks = ["vpn"]

# compose."<file>".<service> = the findings allowed, exactly as the gate prints them.
[compose."stacks/aio/compose.yaml"]
homepage = ["mount: /var/run/docker.sock"]
webtop = ["security_opt: seccomp:unconfined", "mount: /var/run/docker.sock"]
olivetin = ["mount: /var/run/docker.sock"]
calibre = ["security_opt: seccomp:unconfined"]

[compose."stacks/host-monitoring/compose.yaml"]
scrutiny = [
  "privileged", "cap_add: SYS_RAWIO", "cap_add: SYS_ADMIN", "mount: /run/udev",
  "devices: /dev/sda", "devices: /dev/sdb", "devices: /dev/sdc", "devices: /dev/sdd",
  "devices: /dev/sde", "devices: /dev/sdf", "devices: /dev/sdg",
  "devices: /dev/nvme0", "devices: /dev/nvme1", "devices: /dev/nvme2",
]
dash = ["privileged", "mount: /"]
node-exporter = ["mount: /proc", "mount: /sys", "mount: /"]

# The paths come from the stack's env file, so the gate can't see them.
[compose."stacks/immich/compose.yaml"]
immich-server = ["mount: ${UPLOAD_LOCATION}"]
database = ["mount: ${DB_DATA_LOCATION}"]

[compose."stacks/monitoring-apps/compose.yaml"]
alloy = ["mount: /var/run/docker.sock"]

[compose."stacks/monitoring-gitlab/compose.yaml"]
promtail = ["mount: /var/run/docker.sock"]

[compose."stacks/monitoring-nextcloud/compose.yaml"]
promtail = ["mount: /var/run/docker.sock"]

[compose."stacks/monitoring-vpn/compose.yaml"]
alloy = ["mount: /var/run/docker.sock"]

[compose."stacks/photoprism/compose.yaml"]
photoprism = ["security_opt: seccomp:unconfined", "security_opt: apparmor:unconfined"]
mariadb = ["security_opt: seccomp:unconfined", "security_opt: apparmor:unconfined"]

[compose."stacks/traefik/compose.yaml"]
traefik = ["mount: /var/run/docker.sock"]
