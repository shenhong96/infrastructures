# LAPTOP ONLY. No site.yml import, no merge-triggered apply, and no --limit.
# prepare deliberately takes diag offline; activate is a separate maintenance-window run.
- name: Validate complete security operation before any host changes
  hosts: proxmox
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Explicit scope and maintenance approval
      ansible.builtin.assert:
        that:
          - diag_security_action | default('') in ['prepare', 'activate', 'disable', 'guard-inspect', 'guard-check', 'guard-apply', 'guard-enable']
          - ansible_limit | default('') == ''
          - diag_security_maintenance_ack | default(false) | bool
          - >-
            diag_security_action in ['disable', 'guard-inspect', 'guard-check', 'guard-apply', 'guard-enable']
            or diag_transport_pki_dir | default('') | length > 0
        fail_msg: Read docs/diag-security.md; provide action, maintenance ack, PKI and no --limit
    - name: Validate PKI before stopping any service
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../tools/diag-pki.py", check, "{{ diag_transport_pki_dir }}"]
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      when: diag_security_action in ['prepare', 'activate']
    - name: Offline bundle and its signed-index hashes must be supplied before taking diag offline
      ansible.builtin.assert:
        that:
          - diag_transport_deb_files | default([]) | length > 0
          - >-
            diag_transport_deb_files | map('basename')
            | difference(diag_transport_deb_sha256 | default({}) | list) | length == 0
        fail_msg: Supply the Debian 13 amd64 offline bundle and diag_transport_deb_sha256 (docs/diag-security.md)
      when: diag_security_action in ['prepare', 'activate']
    - name: Quiesce the entry point and on-demand CT lifecycle
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: [diag-wake.socket, diag-wake.service, diag-ct.service]
      when: diag_security_action in ['prepare', 'activate', 'disable']
    - name: Keep wake socket disabled until a successful activation
      ansible.builtin.systemd_service:
        name: diag-wake.socket
        enabled: false
      when: diag_security_action in ['prepare', 'activate', 'disable']
    - name: Read any independently started diag CT
      ansible.builtin.command: pct status 121
      check_mode: false
      changed_when: false
      register: diag_security_initial_status
      when: diag_security_action in ['prepare', 'activate', 'disable']
    - name: Quiesce independently started diag too
      ansible.builtin.command: pct exec 121 -- systemctl disable --now diag.service
      changed_when: true
      when:
        - diag_security_action in ['prepare', 'activate', 'disable']
        - "diag_security_initial_status.stdout == 'status: running'"

- name: Prepare authenticated app-side endpoints (no app restarts)
  hosts: vpn:media
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install pinned local TLS terminators
      ansible.builtin.include_role:
        name: diag_transport
      when: diag_security_action in ['prepare', 'activate']
    # qbit sits behind gluetun, so through stunnel it sees the Docker gateway, not .158. A
    # subnet-whitelist login bypass would then 403 every diag read. Fail before any cutover.
    - name: Both qBittorrents answer without login on the exact loopback path stunnel uses
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item }}/api/v2/app/version"
        status_code: 200
        timeout: 5
      loop: [8080, 8090]
      check_mode: false
      when:
        - diag_security_action == 'activate'
        - inventory_hostname == 'vpn'
      register: diag_security_qbit_preflight
      failed_when: false
    - name: Fail closed unless both qBittorrent backends returned 200
      ansible.builtin.assert:
        that: diag_security_qbit_preflight.results | map(attribute='status') | unique == [200]
        fail_msg: >-
          A qBittorrent backend needs login from the Docker gateway source. See
          docs/diag-security.md "qBittorrent login bypass"; never whitelist the whole Docker subnet.
      when:
        - diag_security_action == 'activate'
        - inventory_hostname == 'vpn'

- name: Prepare host client tunnel without exposing the Unix socket
  hosts: proxmox
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Host pinned TLS client
      ansible.builtin.include_role:
        name: diag_transport
      when: diag_security_action in ['prepare', 'activate']
    - name: Diag status
      ansible.builtin.command: pct status 121
      check_mode: false
      changed_when: false
      register: diag_security_status
      when: diag_security_action in ['prepare', 'activate']
    - name: Start diag CT for offline package and service preparation
      ansible.builtin.command: pct start 121
      changed_when: true
      when:
        - diag_security_action in ['prepare', 'activate']
        - "diag_security_status.stdout != 'status: running'"
        - not ansible_check_mode

- name: Prepare or activate isolated diag endpoint
  hosts: diag
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Stop legacy diag before preparing transport (no credentials sent during cutover)
      ansible.builtin.systemd_service:
        name: diag.service
        enabled: false
        state: stopped
      when: diag_security_action in ['prepare', 'activate']
    - name: CT's bidirectional pinned tunnels
      ansible.builtin.include_role:
        name: diag_transport
      when: diag_security_action in ['prepare', 'activate']
    - name: Install secure-only diag program and loopback configuration
      ansible.builtin.include_role:
        name: diag
      vars:
        diag_security_activation_ack: true
      when: diag_security_action == 'activate'

- name: Finish secure cutover or operate the separate source-enforcement stage
  hosts: proxmox
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Secure-only CT firewall (preserve cluster layer-2 policy)
      ansible.builtin.include_role:
        name: proxmox_host
        tasks_from: firewall
      vars:
        proxmox_host_diag_security_activation_ack: true
      when: diag_security_action == 'activate'
    - name: Wake service through authenticated local client
      ansible.builtin.include_role:
        name: proxmox_host
        tasks_from: diag_wake
      when: diag_security_action == 'activate'
    - name: Source enforcement is a separate reviewed stage
      ansible.builtin.include_role:
        name: proxmox_host
        tasks_from: lan_guard
      vars:
        proxmox_host_lan_guard_mode: "{{ diag_security_action | regex_replace('^guard-', '') }}"
      when: diag_security_action in ['guard-inspect', 'guard-check', 'guard-apply', 'guard-enable']

# The playbook's own `pct start` is outside diag-ct.service, so the idle stop would never apply.
# Hand CT 121 back to the socket-activated lifecycle (same shutdown as diag-wake-stop).
- name: Return CT 121 to the on-demand lifecycle
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Stop CT 121 if this run started it
      ansible.builtin.shell: pct shutdown 121 --timeout 30 || pct stop 121
      changed_when: true
      when:
        - diag_security_action in ['prepare', 'activate']
        - "diag_security_status.stdout | default('status: running') != 'status: running'"
        - not ansible_check_mode
