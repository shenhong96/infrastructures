# The fileserver's Linux users with the uids/gids they had on Ubuntu 20.04 (files on the
# bind mounts are owned by these numbers). Groups are created with the same name and gid.
# No home folders (the live users had none) and no Linux passwords: only Samba logs them in.
samba_users:
  - {name: ahlooii, uid: 1000, groups: users}
  - {name: privateshr, uid: 1002, groups: ""}
# Owner of everything in the media and downloads shares: host uid/gid 101000 is uid/gid 1000
# inside the unprivileged app containers, so every app writes as the same user and group.
# Only `force user` uses it; it has no Samba password.
  - {name: media, uid: 101000, groups: ""}
