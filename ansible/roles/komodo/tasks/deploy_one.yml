# One DeployStack (komodo_stack), waited for. A failed deploy stops the play.
- name: Deploy {{ komodo_stack }}
  ansible.builtin.include_tasks: api.yml
  vars:
    api_path: /execute/DeployStack
    api_body: {stack: "{{ komodo_stack }}"}

- name: Wait for {{ komodo_stack }}
  ansible.builtin.include_tasks: await.yml
  vars:
    update_id: "{{ komodo_api.json._id['$oid'] }}"
