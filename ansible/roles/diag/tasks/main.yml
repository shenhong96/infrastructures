# CT 121 (spec 6.2): the diag service and nothing else. No sshd, so Ansible reaches it over
# pct only. No unattended-upgrades: the CT has no internet egress once the firewall is in
# (plan Task 6); updates run through that task's diag-update tag.

- name: Secure transport cutover must be explicitly approved
  ansible.builtin.assert:
    that:
      - diag_security_activation_ack | default(false) | bool
      - diag_transport_pki_dir | default('') | length > 0
    fail_msg: Use diag-security.yml activate after prepare; diag never falls back to plaintext LAN

# Run from the repo root, ansible.cfg (and with it the SOPS vars plugin) isn't loaded and the
# keys arrive as ciphertext; stop before touching the CT. The assertion text holds no values.
- name: App keys are decrypted
  ansible.builtin.assert:
    that:
      - diag_keys[item] is string
      - diag_keys[item] | length >= 16
      - diag_keys[item] | length <= 128
      - "'ENC[' not in diag_keys[item]"
    fail_msg: diag_keys.{{ item }} is missing or still encrypted; run from ansible/ so the SOPS vars plugin loads
    quiet: true
  loop: [qui, jellyfin, sonarr, radarr, prowlarr]

# Stopped most of the time (the host's diag-wake socket starts it on demand).
- name: CT 121 status
  ansible.builtin.command: pct status {{ vmid }}
  delegate_to: proxmox
  register: diag_status
  check_mode: false # read-only
  changed_when: false

# A degraded boot is fine (the template has units that fail in an unprivileged CT); a failed
# start, a failed pct exec or a boot still not finished after 60 s are not.
- name: CT 121 started
  ansible.builtin.shell: |
    pct start {{ vmid }} || exit 1
    # exits 1 when degraded, so judge the printed state, not the exit code
    state=$(timeout 60 pct exec {{ vmid }} -- systemctl is-system-running --wait) || true
    [ "$state" = running ] || [ "$state" = degraded ] || { echo "boot state: ${state:-none}" >&2; exit 1; }
  delegate_to: proxmox
  when: "diag_status.stdout != 'status: running'"
  changed_when: true

# --check can't look inside a stopped CT, and starting it is a change.
- name: Check mode stops here while CT 121 is stopped
  ansible.builtin.meta: end_host
  when: "ansible_check_mode and diag_status.stdout != 'status: running'"

# debian-13-standard_13.6-1 ships a 56 MB /var/lib/dpkg/available. apt never reads it, but
# dpkg --set-selections (every apt install/remove) loads it whole: ~190 MB RSS, and the 256 MB
# CT thrashed at its memory limit for 10+ minutes (2026-11-26). Empty is what dpkg --clear-avail
# leaves.
- name: Stale dpkg available list emptied
  ansible.builtin.copy:
    content: ""
    dest: /var/lib/dpkg/available
    owner: root
    group: root
    mode: "0644"

# The template's mail server, sshd and cron: the service needs none of them.
- name: Unused daemons removed
  ansible.builtin.apt:
    name: [postfix, openssh-server, cron]
    state: absent
    purge: true

- name: Service user
  ansible.builtin.user:
    name: diag
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Authenticated network paths before the program or its credentials
  ansible.builtin.include_role:
    name: diag_transport

- name: Config folder
  ansible.builtin.file:
    path: /etc/diag
    state: directory
    owner: root
    group: diag
    mode: "0750"

- name: Config with the app keys
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/diag/config.json
    owner: root
    group: diag
    mode: "0440"
    backup: true
  no_log: true
  diff: false
  notify: Restart diag

- name: Program folder
  ansible.builtin.file:
    path: /usr/local/lib/diag
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Program
  ansible.builtin.copy:
    src: diag.py
    dest: /usr/local/lib/diag/diag.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart diag

- name: Unit
  ansible.builtin.copy:
    src: diag.service
    dest: /etc/systemd/system/diag.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart diag

- name: Service enabled and running
  ansible.builtin.systemd_service:
    name: diag.service
    enabled: true
    state: started
    daemon_reload: true
