# The Nextcloud stack adopted as found: packages, their config files, and (only when the
# code is missing) the Nextcloud release itself. Never touched: config.php, the data
# folder (/mnt/nc_data, a mount from the host), /var/lib/mysql, occ. The nginx package is
# held at the build running now (it came from nginx.org, which the live box no longer
# lists); the PHP, MariaDB, Redis and fail2ban packages take whatever version is there.
# Not managed: PHP 7.4 and 8.0, acme.sh; both are being removed.

- name: Apt sources and keyrings # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /{{ item }}
  loop:
    - etc/apt/sources.list.d/nginx.list
    - usr/share/keyrings/nginx-archive-keyring.gpg
    - etc/apt/sources.list.d/ondrej-ubuntu-php-jammy.list
    - etc/apt/trusted.gpg.d/ondrej-ubuntu-php.gpg
  register: nextcloud_apt_source

# ponytail: skipped in --check so it isn't one more "changed"; a new source only
# happens on a fresh machine or a real apply.
- name: Refresh the package lists for a new source # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: nextcloud_apt_source is changed and not ansible_check_mode

- name: The nginx package at the running version
  ansible.builtin.apt:
    name: nginx=1.27.0-2~jammy
    state: present

- name: Hold the nginx package
  ansible.builtin.dpkg_selections:
    name: nginx
    selection: hold

- name: PHP 8.2, MariaDB, Redis and fail2ban
  ansible.builtin.apt:
    name:
      - bzip2 # unpacks the Nextcloud release
      - fail2ban
      - mariadb-server
      - php8.2-apcu
      - php8.2-bcmath
      - php8.2-bz2
      - php8.2-cli
      - php8.2-common
      - php8.2-curl
      - php8.2-fpm
      - php8.2-gd
      - php8.2-gmp
      - php8.2-igbinary
      - php8.2-imagick
      - php8.2-intl
      - php8.2-ldap
      - php8.2-mbstring
      - php8.2-mysql
      - php8.2-opcache
      - php8.2-readline
      - php8.2-redis
      - php8.2-smbclient
      - php8.2-xml
      - php8.2-zip
      - redis-server
    state: present

# PHP reaches Redis through its socket, which only the redis group may open.
- name: The www-data user in the redis group
  ansible.builtin.user:
    name: www-data
    groups: redis
    append: true

# ponytail: 2048 bits when it has to be made (the live file is 4096, which takes minutes
# to generate); the live file is public data but *.pem is in .gitignore, so it isn't
# copied into the repo.
- name: The nginx DH parameters
  ansible.builtin.command: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048
  args:
    creates: /etc/ssl/certs/dhparam.pem

- name: The nginx config # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /{{ item }}
  loop:
    - etc/nginx/nginx.conf
    - etc/nginx/conf.d/default.conf # empty on purpose: no default site
    - etc/nginx/conf.d/http.conf
    - etc/nginx/conf.d/nextcloud.conf
  notify: Reload nginx

- name: PHP 8.2 config # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /{{ item }}
  loop:
    - etc/php/8.2/cli/php.ini
    - etc/php/8.2/fpm/php.ini
    - etc/php/8.2/fpm/php-fpm.conf
    - etc/php/8.2/fpm/pool.d/www.conf
    - etc/php/8.2/mods-available/opcache.ini
  notify: Reload PHP 8.2

- name: Redis config # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: etc/redis/redis.conf
    dest: /etc/redis/redis.conf
  notify: Restart Redis

- name: The fail2ban jail and filter # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /{{ item }}
  loop:
    - etc/fail2ban/jail.d/nextcloud.local
    - etc/fail2ban/filter.d/nextcloud.conf
  notify: Reload fail2ban

# Only when /var/www/nextcloud has no code (a machine built from scratch). It never
# updates: upgrading is a separate, deliberate job (maintenance mode, database dump).
# No config.php here, so this leaves a site that still needs occ maintenance:install
# or a restored config.php and database (README).
- name: Nextcloud release, only if the code is missing
  block:
    - name: Is there code
      ansible.builtin.stat:
        path: /var/www/nextcloud/occ
      register: nextcloud_occ

    - name: Download and unpack the release
      when: not nextcloud_occ.stat.exists
      block:
        - name: Download 30.0.4
          ansible.builtin.get_url:
            url: https://download.nextcloud.com/server/releases/nextcloud-30.0.4.tar.bz2
            dest: /var/tmp/nextcloud-30.0.4.tar.bz2
            checksum: sha256:eb6aaba9acef442f2b3e4a996b7ee8a5ed24442f9bba681237fb28ed970e1fa5
            mode: "0644"
            timeout: 120 # the default 10 s timed out once on the scratch test

        - name: /var/www # noqa: risky-file-permissions
          ansible.builtin.file:
            path: /var/www
            state: directory

        - name: Unpack into /var/www/nextcloud
          ansible.builtin.unarchive:
            src: /var/tmp/nextcloud-30.0.4.tar.bz2
            dest: /var/www
            remote_src: true
            owner: www-data
            group: www-data

- name: Web stack running and enabled at boot
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [nginx, php8.2-fpm, mariadb, redis-server, fail2ban]
