# Runs once per container, on the Proxmox host. Adopts the container that exists and
# never replaces one. It creates a container, empty, only when its ID has no config at
# all (the rebuild fallback in the README), and starts one only past the start guard.

- name: Inventory checks (every container, also in --check)
  ansible.builtin.assert:
    that:
      - vmids | unique | length == vmids | length
      - datasets | unique | length == datasets | length
      # One dataset per container, directly under images/, which sanoid snapshots
      # recursively (proxmox_host's sanoid.conf); so no dataset nests in another.
      - datasets | reject('match', 'ZFS-DATA/proxmox-dataset/images/[^/]+$') | list == []
      # ZFS-DATA is the dir storage whose images/<vmid> folders are those datasets.
      - rootfses | reject('match', 'ZFS-DATA:') | list == []
    quiet: true
  run_once: true
  vars:
    vmids: "{{ groups.containers | map('extract', hostvars, 'vmid') | list }}"
    datasets: "{{ groups.containers | map('extract', hostvars, 'dataset') | list }}"
    rootfses: "{{ groups.containers | map('extract', hostvars, ['pct', 'rootfs']) | list }}"

- name: No two mount points share a target
  ansible.builtin.assert:
    that: targets | unique | length == targets | length
    quiet: true
  vars:
    targets: "{{ pct | dict2items | selectattr('key', 'match', 'mp\\d+$') | map(attribute='value')
      | map('regex_replace', '^.*,mp=([^,]*?)/?(,.*)?$', '\\1') | list }}"

- name: On the host
  delegate_to: proxmox
  vars:
    lxc_images: /zfs-data/proxmox/images/{{ vmid }}
  block:
    - name: Container config matches the inventory
      ansible.builtin.command:
        argv: [python3, -c, "{{ lookup('file', 'pct_diff.py') }}", "{{ vmid }}"]
        stdin: "{{ pct | to_json }}"
      register: lxc_pct
      check_mode: false # read-only
      changed_when: (lxc_pct.stdout | from_json).missing or (lxc_pct.stdout | from_json).differs | length > 0

    - name: Parse it
      ansible.builtin.set_fact:
        lxc_config: "{{ lxc_pct.stdout | from_json }}"

    - name: What differs
      ansible.builtin.debug:
        var: lxc_config.differs
      when: lxc_config.differs | default({}) | length > 0

    - name: Never adopt a different container under this ID
      ansible.builtin.assert:
        that: "'hostname' not in lxc_config.differs | default({})"
        fail_msg: CT {{ vmid }} isn't {{ pct.hostname }}. Fix the inventory; a container is never replaced.

    - name: Changes pct can't make
      ansible.builtin.assert:
        that: lxc_config.differs | default({}) | select('match', 'lxc\\.|rootfs$') | list == []
        fail_msg: Edit /etc/pve/lxc/{{ vmid }}.conf by hand (raw lxc.* keys), or use `pct resize` (rootfs).

    - name: The container's own dataset
      ansible.builtin.command: zfs get -H -o value mountpoint {{ dataset }}
      register: lxc_dataset
      check_mode: false # read-only
      changed_when: false
      failed_when: lxc_dataset.rc != 0 and 'does not exist' not in lxc_dataset.stderr

    - name: An existing container sits on its own dataset
      ansible.builtin.assert:
        that: (lxc_dataset.rc == 0 and lxc_dataset.stdout == lxc_images) or (lxc_dataset.rc != 0 and lxc_config.missing)
        fail_msg: "{{ dataset }} should exist, mounted at {{ lxc_images }}"

    - name: Apply config changes (mount point changes wait for a restart)
      ansible.builtin.command:
        argv: "{{ ['pct', 'set', vmid | string] + lxc_config.args }}"
      when: lxc_config.args | length > 0 and not lxc_config.missing and not ansible_check_mode
      changed_when: true

    - name: Starts at boot but isn't running
      ansible.builtin.command: pct status {{ vmid }}
      register: lxc_status
      check_mode: false # read-only
      changed_when: pct.onboot | default('0') == '1' and 'running' not in lxc_status.stdout
      failed_when: false # a missing container

    # Data comes back before a container is created or started: an app that found an
    # empty folder would set itself up from scratch on top of it. (pct create also
    # refuses a missing bind source, but only after the dataset exists.)
    - name: Start guard, every bind-mount source has data # noqa: no-handler (must run before the start, also in --check)
      ansible.builtin.command: find {{ item }} -mindepth 1 -maxdepth 1 -print -quit
      loop: "{{ lxc_config.binds }}"
      register: lxc_guard
      check_mode: false # read-only
      changed_when: false
      failed_when: lxc_guard.stdout == ''
      when: lxc_status is changed or lxc_config.missing

    - name: Create the container empty (rebuild fallback, no dump to restore)
      when: lxc_config.missing and not ansible_check_mode
      block:
        # ponytail: refuses a non-empty folder rather than mounting the dataset over it.
        - name: Its dataset first, so its root volume lands in it
          ansible.builtin.shell: |
            if [ -n "$(ls -A {{ lxc_images }} 2>/dev/null)" ]; then echo "{{ lxc_images }} is not empty" >&2; exit 1; fi
            zfs create -o mountpoint={{ lxc_images }} {{ dataset }}
          when: lxc_dataset.rc != 0
          changed_when: true

        - name: OS template
          ansible.builtin.shell: pveam update && pveam download local {{ lxc_template }}
          args:
            creates: /var/lib/vz/template/cache/{{ lxc_template }}
          throttle: 1

        - name: Container, stopped
          ansible.builtin.command:
            argv: "{{ ['pct', 'create', vmid | string, 'local:vztmpl/' ~ lxc_template] + lxc_config.args }}"
          changed_when: true

        - name: Raw lxc.* keys (pct can't set them)
          ansible.builtin.lineinfile:
            path: /etc/pve/lxc/{{ vmid }}.conf
            line: "{{ item }}"
          loop: "{{ lxc_config.raw }}"

    - name: Start
      ansible.builtin.command: pct start {{ vmid }}
      when: lxc_status is changed and not ansible_check_mode
      changed_when: true
