- name: Validate anti-spoof enrollment mode
  ansible.builtin.assert:
    that:
      - proxmox_host_lan_guard_mode in ['off', 'inspect', 'check', 'apply', 'enable']
      - not (proxmox_host_lan_guard_mode in ['apply', 'enable'] and ansible_check_mode)
    fail_msg: Source enforcement requires an explicit stage; --check never applies changes

# Inspect/check run the controller's checked-in code without writing any target file.
# No credentials are in this manifest: only public NIC bindings and review decisions.
- name: Inspect, validate, enroll, or separately enable anti-spoof rules
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'lan_guard.py') }}"
      - "{{ proxmox_host_lan_guard_mode }}"
      - --manifest
      - '-'
    stdin: "{{ proxmox_host_lan_guard_manifest | to_json }}"
  register: proxmox_host_lan_guard_result
  check_mode: false
  changed_when: "'backup: ' in proxmox_host_lan_guard_result.stdout"
  when: proxmox_host_lan_guard_mode != 'off'

- name: Source-enforcement results and exact rollback backup handle
  ansible.builtin.debug:
    msg: "{{ proxmox_host_lan_guard_result.stdout }}"
  when: proxmox_host_lan_guard_mode != 'off'

- name: Install rollback tool after a successful write
  ansible.builtin.copy:
    src: lan_guard.py
    dest: /usr/local/sbin/lan-guard
    owner: root
    group: root
    mode: "0750"
  when: proxmox_host_lan_guard_mode in ['apply', 'enable'] and not ansible_check_mode
