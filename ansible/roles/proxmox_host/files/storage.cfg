dir: local
	path /var/lib/vz
	content vztmpl,iso,backup

zfspool: local-zfs
	pool rpool/data
	content images,rootdir
	sparse 1

dir: WD_My_Passport
	path /mnt/ext_WD_My_Passport
	content iso,backup,rootdir,snippets,vztmpl,images
	prune-backups keep-all=1
	shared 0

dir: ZFS-DATA
	path /zfs-data/proxmox
	content rootdir,iso,backup,images,vztmpl,snippets
	prune-backups keep-all=1
	shared 0

dir: MergerFS
	path /mnt/storage/backups/proxmox
	content vztmpl,snippets,rootdir,iso,backup,images
	prune-backups keep-all=1
	shared 0

