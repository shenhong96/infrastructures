---
version: "3.3"
x-base: &base #define "base" as anchor key
  restart: always 
x-lsio: &lsio
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Kuala_Lumpur
    - UMASK=002
x-internalbase: &internalbase
  <<: *base #calling "base" and pull its value
  networks:
    - internal
x-vpnbase: &vpnbase
  <<: *base
  network_mode: "service:vpn"
x-lsiobase: &local
  <<: [*internalbase, *lsio]
x-vpnlsiobase: &vpn
  <<: [*vpnbase, *lsio]

x-wg-port: &exposed_port
  ports:
    - 8080:8080 #qbittorrent
    - 7878:7878 #radarr
    - 8989:8989 #sonarr
    - 8686:8686 #lidarr
    - 6767:6767 #bazarr
    - 8787:8787 #readarr
    - 6969:6969 #whisparr
    - 8082:80 #nginx (vuetorrent)

x-monitoring: &loki
  labels:
    logging: "promtail"
    logging_jobname: "containerlogs"

services:
  vpn:
    image: ghcr.io/linuxserver/wireguard:1.0.20210914
    privileged: true
    container_name: vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    restart: always
    <<: [*exposed_port, *local, *loki]

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:4.0.3
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - UMASK=002
    ports:
      - 8085:8085
    volumes:
      - ./sabnzbd:/config
      - /mnt/data/downloads/complete:/downloads #optional
      - /mnt/data/downloads/incomplete:/incomplete-downloads #optional
        #network_mode: "service:vpn"
    <<: [*local, *loki]

  nginx:
    image: nginx
    container_name: nginx
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./qbittorrent/config/VueTorrent:/opt/vuetorrent
    network_mode: "service:vpn"
    restart: always
    <<: *loki

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.0.1-libtorrentv1
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - UMASK=002
      - WEBUI_PORT=8080
        #- DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
        #- TP_THEME=plex
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/data/downloads:/downloads
    network_mode: "service:vpn"
    restart: always
    <<: *loki

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:1.29.2
    container_name: prowlarr
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    <<: [*local, *loki]

  jackett:
    image: lscr.io/linuxserver/jackett:0.22.1211
    container_name: jackett
    volumes:
      - ./jackett:/config
      - /mnt/data/downloads:/downloads
    ports:
      - 9117:9117 #jackett
    <<: [*local, *loki]

  radarr:
    image: ghcr.io/linuxserver/radarr:5.28.0
    container_name: radarr
    volumes:
      - ./radarr:/config
      - /mnt/data:/data
    <<: [*vpn, *loki]

  sonarr:
    image: linuxserver/sonarr:4.0.15
    container_name: sonarr
    volumes:
      - ./sonarr:/config
      - /mnt/data:/data
    <<: [*vpn, *loki]

    #  lidarr:
    #    image: ghcr.io/linuxserver/lidarr:1.1.4-nightly
    #    container_name: lidarr
    #    volumes:
    #      - ./lidarr/config:/config
    #      - /mnt/data/media/Music:/media #optional
    #    <<: [*vpn, *loki]

  bazarr:
    image: ghcr.io/linuxserver/bazarr:1.5.2
    container_name: bazarr
    volumes:
      - ./bazarr/config:/config
      - /mnt/data/media:/data/media
      - /mnt/data/downloads:/downloads
    <<: [*vpn, *loki]

  readarr:
    image: ghcr.io/linuxserver/readarr:0.3.1-develop
    container_name: readarr
    volumes:
      - ./readarr/data:/config
      - /mnt/data/media/Books:/media #optional
      - /mnt/data/downloads:/downloads #optional
    <<: *vpn

  jellyseerr:
    container_name: jellyseerr
    image: fallenbagel/jellyseerr:1.1.1
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - 5055:5055
    environment:
      TZ: Asia/Kuala_Lumpur
      PGID: 1000
      PUID: 1000
    networks:
      - internal
    restart: always

  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:v3
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - ./whisparr:/config
      - /mnt/whisparr:/media
      - /mnt/data/downloads:/downloads #optional
    restart: always
    <<: *loki

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Asia/Kuala_Lumpur
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
    <<: [*internalbase, *loki]

  iyuu:
    stdin_open: true
    tty: true
    volumes:
      - ./iyuu:/iyuu
      - ./iyuu/data:/data
    ports:
      - "8780:8780"
    container_name: iyuu
    restart: always
    image: iyuucn/iyuuplus-dev:latest

  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    volumes:
      - ./qui:/config
    ports:
      - 8081:7476
    <<: [*local, *loki]

networks:
  # Created by compose (was external). qBittorrent WebUI whitelists 172.18.0.0/16: keep this subnet.
  internal:
    name: internal
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
