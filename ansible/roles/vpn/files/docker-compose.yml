---
version: "3.3"
x-base: &base #define "base" as anchor key
  restart: always 
x-lsio: &lsio
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Kuala_Lumpur
    - UMASK=002
x-internalbase: &internalbase
  <<: *base #calling "base" and pull its value
  networks:
    - internal
x-vpnbase: &vpnbase
  <<: *base
  network_mode: "service:vpn"
x-lsiobase: &local
  <<: [*internalbase, *lsio]
x-vpnlsiobase: &vpn
  <<: [*vpnbase, *lsio]

x-wg-port: &exposed_port
  ports:
    - 8080:8080 #qbittorrent
    - 7878:7878 #radarr
    - 8989:8989 #sonarr
    - 8686:8686 #lidarr
    - 6767:6767 #bazarr
    - 6969:6969 #whisparr

x-monitoring: &loki
  labels:
    logging: "promtail"
    logging_jobname: "containerlogs"

services:
  vpn:
    image: ghcr.io/linuxserver/wireguard:1.0.20260223-r0-ls127
    privileged: true
    container_name: vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    restart: always
    <<: [*exposed_port, *local, *loki]

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls278
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - UMASK=002
    ports:
      - 8085:8085
    volumes:
      - ./sabnzbd:/config
      - /mnt/data/downloads/complete:/downloads #optional
      - /mnt/data/downloads/incomplete:/incomplete-downloads #optional
        #network_mode: "service:vpn"
    <<: [*local, *loki]

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:libtorrentv1-release-5.1.4_v1.2.20-ls112
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - UMASK=002
      - WEBUI_PORT=8080
        #- DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
        #- TP_THEME=plex
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/data/downloads:/downloads
    network_mode: "service:vpn"
    restart: always
    <<: *loki

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    container_name: prowlarr
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    <<: [*local, *loki]

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2949-ls19
    container_name: jackett
    volumes:
      - ./jackett:/config
      - /mnt/data/downloads:/downloads
    ports:
      - 9117:9117 #jackett
    <<: [*local, *loki]

  radarr:
    image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls324
    container_name: radarr
    volumes:
      - ./radarr:/config
      - /mnt/data:/data
    <<: [*vpn, *loki]

  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    volumes:
      - ./sonarr:/config
      - /mnt/data:/data
    <<: [*vpn, *loki]

    #  lidarr:
    #    image: ghcr.io/linuxserver/lidarr:1.1.4-nightly
    #    container_name: lidarr
    #    volumes:
    #      - ./lidarr/config:/config
    #      - /mnt/data/media/Music:/media #optional
    #    <<: [*vpn, *loki]

  bazarr:
    image: ghcr.io/linuxserver/bazarr:v1.6.2-ls370
    container_name: bazarr
    volumes:
      - ./bazarr/config:/config
      - /mnt/data/media:/data/media
      - /mnt/data/downloads:/downloads
    <<: [*vpn, *loki]

  # Jellyseerr became Seerr: it migrates ./jellyseerr on first start. Runs as node (1000:1000)
  # whatever PUID says, so the folder must be owned by 1000:1000, and has no init of its own.
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - 5055:5055
    environment:
      TZ: Asia/Kuala_Lumpur
    networks:
      - internal
    restart: always

  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:v3@sha256:fde13c538a97c8c5e5d1003541151e37bc8478dec6c24f309c5d01f7fcf1406a
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - ./whisparr:/config
      - /mnt/whisparr:/media
      - /mnt/data/downloads:/downloads #optional
    restart: always
    <<: *loki

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Asia/Kuala_Lumpur
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
    <<: [*internalbase, *loki]

  iyuu:
    stdin_open: true
    tty: true
    volumes:
      - ./iyuu:/iyuu
      - ./iyuu/data:/data
    ports:
      - "8780:8780"
    container_name: iyuu
    restart: always
    image: iyuucn/iyuuplus-dev@sha256:512648cd53832def881c88815045cfbc61e0ca9fd3e226290b66ec97cac59193

  qui:
    image: ghcr.io/autobrr/qui:v1.33.1
    container_name: qui
    volumes:
      - ./qui:/config
    ports:
      - 8081:7476
    <<: [*local, *loki]

networks:
  # Created by compose (was external). qBittorrent WebUI whitelists 172.18.0.0/16: keep this subnet.
  internal:
    name: internal
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
