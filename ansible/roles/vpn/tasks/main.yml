# The vpn machine's media stack, adopted as found on 2026-10-24: the Compose file Komodo runs
# in files-on-server mode (stacks/vpn/komodo.toml: project root, /root/docker-compose.yml) and
# the vpn container's WireGuard config (/root/wireguard/config is the container's /config).
# Only the files: nothing here restarts or recreates a container. A changed compose file is
# picked up by the next deploy of the vpn stack in Komodo; a changed wg0.conf only when the vpn
# container restarts (and with it everything in its network namespace).
# Not managed: /root/.env (flaresolverr's log settings, read by Compose for interpolation),
# the apps' config folders under /root/<app>, and the rest of /root/wireguard/config
# (myannonymous.sh comes from base's secret files; the MAM cookies are written by the script).

- name: The WireGuard config folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - /root/wireguard
    - /root/wireguard/config
    - /root/wireguard/config/wg_confs

- name: Compose file of the stack (Komodo project root)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /root/docker-compose.yml
    owner: root
    group: root
    mode: "0600"

# Moves finished torrents from the second client to qbittorrent (see the compose file). The
# client and script names are private: vpn_alt_client and vpn_handoff in secrets.sops.yml.
- name: Handoff script
  ansible.builtin.copy:
    src: qbit-handoff.sh
    dest: /root/scripts/{{ vpn_handoff }}.sh
    owner: root
    group: root
    mode: "0755"

- name: Handoff cron
  ansible.builtin.copy:
    dest: /etc/cron.d/{{ vpn_handoff }}
    owner: root
    group: root
    mode: "0644"
    content: |
      */10 * * * * root /root/scripts/{{ vpn_handoff }}.sh >> /var/log/{{ vpn_handoff }}.log 2>&1

# Keys and tunnel address from host_vars/vpn/secrets.sops.yml. 1000:1000 as found; 0600 since the
# image warns about a world-readable one. Images since 2022 read wg_confs/, not /config/wg0.conf.
- name: WireGuard config of the vpn container
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /root/wireguard/config/wg_confs/wg0.conf
    owner: "1000"
    group: "1000"
    mode: "0600"
  no_log: true
  diff: false

# Episode coverage: which indexer has which episodes of watched shows; Hermes reads it over
# HTTP through the read-only proxy. Its data (coverage.db) stays on the machine. Default sites
# and the API's bind/port/allowed client are private: coverage_config in secrets.sops.yml.
- name: Episode coverage folder
  ansible.builtin.file:
    path: /root/coverage
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Episode coverage script
  ansible.builtin.copy:
    src: coverage/coverage.py
    dest: /root/coverage/coverage.py
    owner: root
    group: root
    mode: "0755"
  notify:
    - Restart episode coverage API
    - Restart episode coverage bot

- name: Episode coverage config
  ansible.builtin.template:
    src: coverage-config.json.j2
    dest: /root/coverage/config.json
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify:
    - Restart episode coverage API
    - Restart episode coverage bot

- name: Episode coverage units
  ansible.builtin.copy:
    src: "coverage/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - episode-coverage.service
    - episode-coverage.timer
    - episode-coverage-api.service
    - episode-coverage-bot.service
  notify:
    - Restart episode coverage API
    - Restart episode coverage bot

- name: Episode coverage timer and API running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - episode-coverage.timer
    - episode-coverage-api.service

# The approval bot only runs once its keys are in coverage_config (grab_bot_token,
# owner_user_id, owner_chat_id); without them `coverage.py bot` refuses to start.
- name: Episode coverage approval bot running
  ansible.builtin.systemd_service:
    name: episode-coverage-bot.service
    enabled: true
    state: started
    daemon_reload: true
  when: coverage_config.grab_bot_token is defined
