# OS basics on the host and inside each container Ansible can run in, adopted as found.
# Not managed: users, and SSH keys other than Ansible's own login key. One-off fixes (e.g.
# removing a stale key) run once as ad-hoc commands; this role only declares the state to keep.

# ponytail: not the apt module; Ansible's Python on the 20.04 containers (3.9, deadsnakes)
# has no apt bindings. Only a new container lacks these.
- name: Tools the tasks below use # noqa: command-instead-of-module
  ansible.builtin.shell: apt-get update && apt-get install -y curl git vim
  args:
    creates: /usr/bin/git

- name: Timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/{{ timezone }}
    dest: /etc/localtime
    state: link

- name: Timezone name
  ansible.builtin.copy:
    content: "{{ timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"

# The validate below (sshd -t) needs it; a new container's sshd hasn't run yet to make it.
- name: The sshd runtime folder
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: SSH port and root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^{{ item.split()[0] }}\s
    line: "{{ item }}"
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - Port 2278
    - PermitRootLogin prohibit-password
  notify: Restart sshd

# Ansible reaches containers over SSH (inventory `containers`), so root needs the admin key.
# Not on the host: its authorized_keys is Proxmox's symlink into /etc/pve/priv, and the
# key is already there.
- name: Ansible's login key
  when: inventory_hostname in groups.containers
  block:
    # sshd's StrictModes ignores the key if root's home is group- or world-writable (118 had 775).
    - name: Root's home is not writable by others
      ansible.builtin.file:
        path: /root
        mode: g-w,o-w

    - name: Root's SSH folder
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Matched by the key itself, so a copy with another comment is replaced, not duplicated.
    # Other keys in the file are left alone.
    - name: Root's authorized_keys has it
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        regexp: ^\S+ {{ admin_ssh_pubkey.split()[1] | regex_escape }}( |$)
        line: "{{ admin_ssh_pubkey }}"
        create: true
        owner: root
        group: root
        mode: "0600"

# Scripts are mirrored under files/common/ (every machine) and files/<machine>/, by
# their path from /. Content only: existing files keep their modes (0600 or 0644).
- name: Scripts every machine has # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: common/
    dest: /

- name: Scripts only this machine has # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: "{{ inventory_hostname }}/"
    dest: /
  when: (role_path ~ '/files/' ~ inventory_hostname) is directory

# A file holding a secret is kept whole, base64-encoded (so Jinja never parses it), in
# the machine's secrets.sops.yml as secret_files_b64: [{key: path, value: content}, ...], so the
# paths are encrypted too.
- name: Folders of the files that hold a secret # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory # no mode: a folder that exists stays as it is
  loop: "{{ secret_files_b64 | default([]) | map(attribute='key') | map('dirname') | unique | list }}"

- name: Files that hold a secret # noqa: risky-file-permissions
  ansible.builtin.copy:
    content: "{{ item.value | b64decode }}"
    dest: "{{ item.key }}"
  loop: "{{ secret_files_b64 | default([]) }}"
  no_log: true
  diff: false

# Whole crontabs per user: files/crontabs/<machine>/<user>, or secret_crontabs_b64 in the
# machine's secrets.sops.yml when one holds a secret. The cron module can't adopt a job
# that lacks its "#Ansible:" marker; it would add a second copy of it.
- name: Crontabs
  no_log: true # a crontab can hold a ping URL
  vars:
    base_crontab_dir: "{{ role_path }}/files/crontabs/{{ inventory_hostname }}"
    base_secret_crontabs: "{{ secret_crontabs_b64 | default({}) }}"
  block:
    - name: Crontabs match the repo
      ansible.builtin.command: crontab -l -u {{ item }}
      loop: "{{ query('fileglob', base_crontab_dir ~ '/*') | map('basename') | list + base_secret_crontabs | list }}"
      vars:
        base_crontab: "{{ base_secret_crontabs[item] | b64decode if item in base_secret_crontabs
          else lookup('file', base_crontab_dir ~ '/' ~ item) }}"
      register: base_crontabs
      check_mode: false # read-only
      changed_when: base_crontabs.stdout | trim != base_crontab | trim
      failed_when: base_crontabs.rc != 0 and 'no crontab' not in base_crontabs.stderr

    - name: Install the crontabs that differ
      ansible.builtin.command: crontab -u {{ item.item }} -
      args:
        stdin: "{{ base_crontab | trim }}"
      vars:
        base_crontab: "{{ base_secret_crontabs[item.item] | b64decode if item.item in base_secret_crontabs
          else lookup('file', base_crontab_dir ~ '/' ~ item.item) }}"
      loop: "{{ base_crontabs.results | select('changed') }}"
      when: not ansible_check_mode
      changed_when: true

# Installed once; after that its version is left alone (apt upgrades it).
- name: Docker
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
    executable: /bin/bash

- name: Vim settings (containers; the host has none)
  when: inventory_hostname in groups.containers
  block:
    - name: Vimrc
      ansible.builtin.copy:
        src: vimrc
        dest: /root/.vimrc
        owner: root
        group: root
        mode: "0644"

    - name: Dracula theme
      ansible.builtin.git:
        repo: https://github.com/dracula/vim.git
        dest: /root/.vim/pack/themes/start/dracula
        version: master
        update: false
