# Metrics on :9100 for Prometheus, from Ubuntu's package (not a hand-copied binary).
# ponytail: same port as the old hand-copied 1.2.2 binaries (CT 104, CT 114); collector defaults
# and some metric names differ between 1.2 and 1.7.
- name: Node exporter package
  ansible.builtin.apt:
    name: prometheus-node-exporter
    update_cache: true
    cache_valid_time: 86400
    state: present

- name: Node exporter running and enabled at boot
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: started
