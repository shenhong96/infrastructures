# One named resource of the project (res_path, res_want): create it, or replace it when a field
# this role owns differs (a PUT replaces the whole object, so the body is what Semaphore has,
# with res_want on top). Its id lands in semaphore_ids[res_path].
- name: Read {{ res_path }}
  ansible.builtin.include_tasks: api.yml
  vars:
    api_path: /project/{{ semaphore_project_id }}/{{ res_path }}

- name: Compare {{ res_want.name }}
  ansible.builtin.set_fact:
    semaphore_have: "{{ have }}"
    # Only the fields this role owns, as Semaphore has them.
    semaphore_have_owned: "{{ res_want | combine(have | dict2items | selectattr('key', 'in', res_want) | items2dict) }}"
  vars:
    have: "{{ semaphore_api.json | selectattr('name', 'equalto', res_want.name) | first | default({}) }}"

- name: What differs in {{ res_want.name }}
  ansible.builtin.debug:
    msg: "{{ 'missing' if semaphore_have == {} else {'have': semaphore_have_owned, 'want': res_want} }}"
  changed_when: semaphore_have == {} or semaphore_have_owned != res_want
  when: semaphore_have == {} or semaphore_have_owned != res_want

- name: Create {{ res_want.name }}
  ansible.builtin.include_tasks: api.yml
  vars:
    api_path: /project/{{ semaphore_project_id }}/{{ res_path }}
    api_method: POST
    api_body: "{{ res_want | combine({'project_id': semaphore_project_id | int}) }}"
  when: semaphore_have == {} and not ansible_check_mode

- name: Its id
  ansible.builtin.set_fact:
    semaphore_have: "{{ semaphore_api.json }}"
  when: semaphore_have == {} and not ansible_check_mode

- name: Replace {{ res_want.name }}
  ansible.builtin.include_tasks: api.yml
  vars:
    api_path: /project/{{ semaphore_project_id }}/{{ res_path }}/{{ semaphore_have.id }}
    api_method: PUT
    api_body: "{{ semaphore_have | combine(res_want) }}"
  when: semaphore_have != {} and semaphore_have_owned != res_want and not ansible_check_mode

- name: Remember the id of {{ res_path }}
  ansible.builtin.set_fact:
    semaphore_ids: "{{ semaphore_ids | default({}) | combine({res_path: semaphore_have.id | default(0)}) }}"
