# Only when the stack is up: on a new container the first `up` reads the file anyway.
- name: Reload Caddy
  ansible.builtin.shell: |
    cd /opt/caddy
    [ -n "$(docker compose -p proxy ps -q --status running caddy)" ] || exit 0
    docker compose -p proxy exec -T caddy caddy reload --config /etc/caddy/Caddyfile
  changed_when: true
