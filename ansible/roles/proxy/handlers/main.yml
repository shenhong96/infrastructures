# Only when Caddy is up: on a new container the first `up` reads the file anyway. Plain docker
# commands, because /opt/caddy no longer holds a compose file (Komodo runs the stack).
- name: Reload Caddy
  ansible.builtin.shell: |
    [ -n "$(docker ps -q --filter name=^caddy$ --filter status=running)" ] || exit 0
    docker exec caddy caddy reload --config /etc/caddy/Caddyfile
  changed_when: true
