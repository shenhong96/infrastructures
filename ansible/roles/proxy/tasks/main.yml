# The reverse proxy CT: the files Caddy reads under /opt/caddy (node-exporter is the node_exporter role).
# Komodo owns the stack itself (stacks/proxy/compose.yaml and Dockerfile, run from its own clone), so
# this role places neither, and the two tools never manage one file. Not managed: the containers,
# /opt/caddy/.env (base delivers it from SOPS as a secret file), Caddy's certificate state under
# data/ and config/. The Caddyfile stays here, not with Komodo, because its change is a reload.

- name: Stack folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/opt/caddy, /opt/caddy/conf, /opt/caddy/data, /opt/caddy/config]

# base writes it with the default mode; it holds the Cloudflare token.
- name: The env file is root-only
  ansible.builtin.file:
    path: /opt/caddy/.env
    owner: root
    group: root
    mode: "0600"

# More sites, kept whole and base64-encoded in SOPS; the Caddyfile imports it.
- name: Private Caddy sites
  ansible.builtin.copy:
    content: "{{ proxy_private_caddy_b64 | b64decode }}"
    dest: /opt/caddy/conf/private.caddy
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Reload Caddy

- name: Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/proxy/Caddyfile"
    dest: /opt/caddy/conf/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload Caddy
