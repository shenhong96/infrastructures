# The reverse proxy CT: the Caddy stack's files under /opt/caddy (node-exporter is the node_exporter role).
# Not managed: the containers themselves (stacks belong to Komodo; the first
# `docker compose up -d --build` is a one-off, see the README), /opt/caddy/.env (base
# delivers it from SOPS as a secret file), Caddy's certificate state under data/ and config/.

- name: Stack folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/opt/caddy, /opt/caddy/conf, /opt/caddy/data, /opt/caddy/config]

# base writes it with the default mode; it holds the Cloudflare token.
- name: The env file is root-only
  ansible.builtin.file:
    path: /opt/caddy/.env
    owner: root
    group: root
    mode: "0600"

- name: Compose file and Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/proxy/{{ item }}"
    dest: /opt/caddy/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: [compose.yaml, Dockerfile]

# More sites, kept whole and base64-encoded in SOPS; the Caddyfile imports it.
- name: Private Caddy sites
  ansible.builtin.copy:
    content: "{{ proxy_private_caddy_b64 | b64decode }}"
    dest: /opt/caddy/conf/private.caddy
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Reload Caddy

- name: Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/proxy/Caddyfile"
    dest: /opt/caddy/conf/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload Caddy
