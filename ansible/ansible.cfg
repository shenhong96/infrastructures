[defaults]
# All 8 machines in one wave (the default 5 left 3 for a second wave).
forks = 10
inventory = inventory.yml
collections_path = ./collections
# SOPS replaces ansible-vault: every *.sops.yml under group_vars/ and host_vars/
# is decrypted in memory while a playbook runs. Nothing decrypted touches disk.
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
connection_plugins = ./connection_plugins

# Pipelining (module piped over stdin, no tmp dir) cuts the calls per task, over ssh and
# over the bootstrap pct connection (~0.7 s of Perl startup per `pct exec`). No PTY for
# pct: we are root, and a PTY would mangle stdin and large output. ssh reuses its
# connection by default (ControlPersist=60s).
[connection]
pipelining = True

[paramiko_connection]
pty = False
