[defaults]
inventory = inventory.yml
collections_path = ./collections
# SOPS replaces ansible-vault: every *.sops.yml under group_vars/ and host_vars/
# is decrypted in memory while a playbook runs. Nothing decrypted touches disk.
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
connection_plugins = ./connection_plugins

# ponytail: the pct connection plugin runs each `pct exec` as ~0.7 s of Perl startup, so
# pipelining (module piped over stdin, no tmp dir) and no PTY (we are root; a PTY would
# also mangle stdin and large output) cut the per-task exec calls.
[connection]
pipelining = True

[paramiko_connection]
pty = False
