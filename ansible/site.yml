# The only playbook; tags select one part of it. Roles for the containers (lxc, base,
# gitlab, jellyfin, nextcloud, tailscale, komodo) are added as they reach zero changes.
- name: Proxmox host
  hosts: proxmox
  tags: host
  gather_facts: false # nothing uses facts; saves a round trip
  roles:
    - proxmox_host

# Each container's Proxmox side (config, dataset, start guard); every task runs on the host.
- name: Containers
  hosts: containers
  tags: lxc
  gather_facts: false # a container may not exist yet
  roles:
    - lxc

- name: Inside each machine
  hosts: proxmox:containers:!skip_inside
  tags: base
  gather_facts: false # nothing uses facts
  roles:
    - base

- name: GitLab
  hosts: gitlab
  tags: gitlab
  gather_facts: false # nothing uses facts
  roles:
    - gitlab

- name: Jellyfin
  hosts: media
  tags: jellyfin
  gather_facts: false # nothing uses facts
  roles:
    - jellyfin

- name: Nextcloud
  hosts: nextcloud
  tags: nextcloud
  gather_facts: false # nothing uses facts
  roles:
    - nextcloud

# Last: on a rebuilt machine it stops at the manual tailnet login, after the apps are in.
- name: Tailscale
  hosts: tailscale
  tags: tailscale
  gather_facts: false # nothing uses facts
  roles:
    - tailscale
