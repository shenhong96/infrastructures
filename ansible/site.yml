# The only playbook; tags select one part of it. Roles for the containers (lxc, base,
# samba, gitlab, jellyfin, nextcloud, proxy, node_exporter, tailscale, komodo) are added as they reach zero changes.
- name: Proxmox host
  hosts: proxmox
  tags: host
  gather_facts: false # nothing uses facts; saves a round trip
  roles:
    - proxmox_host

# Each container's Proxmox side (config, dataset, start guard); every task runs on the host.
- name: Containers
  hosts: containers
  tags: lxc
  gather_facts: false # a container may not exist yet
  roles:
    - lxc

- name: Inside each machine
  hosts: proxmox:containers:!skip_inside
  tags: base
  gather_facts: false # nothing uses facts
  roles:
    - base

- name: Samba file server
  hosts: fileserver
  tags: samba
  gather_facts: false # nothing uses facts
  roles:
    - samba

- name: GitLab
  hosts: gitlab
  tags: gitlab
  gather_facts: false # nothing uses facts
  roles:
    - gitlab

- name: Jellyfin
  hosts: media
  tags: jellyfin
  gather_facts: false # nothing uses facts
  roles:
    - jellyfin

- name: Nextcloud
  hosts: nextcloud
  tags: nextcloud
  gather_facts: false # nothing uses facts
  roles:
    - nextcloud

- name: Reverse proxy
  hosts: proxy
  tags: proxy
  gather_facts: false # nothing uses facts
  roles:
    - proxy

# Komodo Core and its database, then the agents; enrollment (agents connect) is a separate
# deliberate run: -e komodo_enrolled=true. Core goes first so a restored or rebuilt Core
# has its servers and their keys in place before an agent ever connects.
- name: Komodo Core
  hosts: komodo
  tags: komodo
  gather_facts: false # nothing uses facts
  roles:
    - komodo

- name: Komodo agents
  hosts: periphery
  tags: periphery
  gather_facts: false # nothing uses facts
  roles:
    - periphery

# After the agents were restarted: when enrolled, every one has to show Ok in Core.
- name: Komodo agents are connected
  hosts: komodo
  tags: komodo
  gather_facts: false # nothing uses facts
  tasks:
    - name: Agents connected
      ansible.builtin.include_role:
        name: komodo
        tasks_from: connected
      when: komodo_enrolled | bool and not ansible_check_mode

# Prometheus node-exporter on the machines in the node_exporter group (proxy; vpn after its rebuild).
- name: Node exporter
  hosts: node_exporter
  tags: node_exporter
  gather_facts: false # nothing uses facts
  roles:
    - node_exporter

# Last: on a rebuilt machine it stops at the manual tailnet login, after the apps are in.
- name: Tailscale
  hosts: tailscale
  tags: tailscale
  gather_facts: false # nothing uses facts
  roles:
    - tailscale

# This repo's GitHub settings and rulesets, with your token: laptop only, never Semaphore.
- name: GitHub
  hosts: localhost
  connection: local
  tags: github
  gather_facts: false
  roles:
    - github
