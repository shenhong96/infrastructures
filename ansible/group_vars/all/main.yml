# Plain settings for every machine. Secrets are in secrets.sops.yml next to this file.
timezone: Asia/Kuala_Lumpur

# The admin's (Mac's) public key: Ansible logs in to every container as root with it.
# Placed by `base`. Public, so it is plain here.
admin_ssh_pubkey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINaW4+uZXr3Vx5XAqqefMUrOacOcp+hkRLtdQsD67ejp shenhongyee@Shens-MacBook-Air.local

# Semaphore's runner on control logs in with it (a merge's Ansible). Placed by `base` on every
# container but control; never on the host. Public, so it is plain here.
ops_ssh_pubkey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOTnpC8KTDbryed1y3H7lGYZSI0nHA69IBWWGPvnyOWs ops@control

# Komodo. Agents connect to Core only when this is true (enrolled 2026-10-01, Phase 3 step 2;
# it was a deliberate run after the install had been reviewed).
komodo_enrolled: true
# Create or reconcile the main sync (servers.toml + stacks/) and run it on each komodo run.
komodo_sync: true
# Replace the Core key every agent trusts. Only after Core's keys were really lost.
komodo_replace_core_key: false
# Core's LAN address, from its container config; agents connect to ws://<it>:9120.
komodo_core_ip: "{{ hostvars[groups.komodo[0]].pct.net0 | regex_search('ip=([0-9.]+)/', '\\1') | first }}"
